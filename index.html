<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameStore</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="container">

            <h1>GameStore</h1>

            <nav>
                <a href="#">Início</a>
                <a href="#">Jogos</a>
                <a href="#">Promoções</a>
            </nav>

        </div>

    </header>


    <main class="container">

        <section class="banner">

            <h2>Encontre seu próximo jogo</h2>

            <p>Os melhores jogos por preços incríveis.</p>

            <button>Ver jogos</button>

        </section>


        <h2>Jogos em destaque</h2>


        <section class="produtos">

            <div class="produto">

                <div class="imagem">
                    🎮
                </div>

                <h3>Cyber Adventure</h3>

                <p>R$ 99,90</p>

                <button>Comprar</button>

            </div>


            <div class="produto">

                <div class="imagem">
                    🧙
                </div>

                <h3>Fantasy World</h3>

                <p>R$ 79,90</p>

                <button>Comprar</button>

            </div>


            <div class="produto">

                <div class="imagem">
                    🚗
                </div>

                <h3>Street Racing</h3>

                <p>R$ 59,90</p>

                <button>Comprar</button>

            </div>

        </section>

    </main>


    <footer>
        <p>© 2026 GameStore</p>
    </footer>

</body>

</html>
